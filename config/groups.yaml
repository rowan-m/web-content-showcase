# Display groups / playlists.
# Select a group via URL query param:
#   /?group=<name>       in-page slideshow (YouTube, RSS cards, embeddable URLs)
#   /next?group=<name>   persistent localStorage router (handles blocked-iframe redirects)
#
# Fields:
#   description: human-readable label for /preview
#   order: sequential | random (defaults to "sequential")
#   maxVideoDuration: optional video cap override for this group (e.g. "10m" or false for full length)
#   sources: list of source IDs, group names, or wildcards ('*', 'youtube:*', 'feeds:*', 'urls:*')
#   exclude: optional list of source IDs, group names, or wildcards to subtract from sources

web:
  description: All non-video content (web pages, blog cards, and interstitials)
  order: random
  sources:
    - '*'
  exclude:
    - videos
    - shorts
    - chrome-blog-live

web-live:
  description: Web pages and live blog articles via top-level redirect (no video)
  order: sequential
  sources:
    - web-pages
    - chrome-blog-live
    - interstitials

quiet-cards:
  description: Distraction-free RSS & blog summary cards with QR codes
  order: sequential
  sources:
    - feeds:*
    - interstitials
  exclude:
    - chrome-blog-live

blogs:
  description: Personal & community web dev blog cards
  order: sequential
  sources:
    - feeds:*
  exclude:
    - chrome-blog
    - chrome-blog-live
    - web-dev-blog
    - chromium-blog

videos:
  description: Recent @ChromeDevs videos and curated talks
  order: sequential
  sources:
    - chrome-devs-videos
    - curated-videos

shorts:
  description: Recent @ChromeDevs Shorts
  order: sequential
  sources:
    - chrome-devs-shorts

all-media:
  description: Full mix of videos, Shorts, blog cards, web pages, and interstitials
  order: random
  sources:
    - '*'
  exclude:
    - chrome-blog-live
