# YouTube sources: recent channel videos, recent channel Shorts, and curated video lists.
# Each top-level key is a source ID referenced from config/groups.yaml.
#
# Channel source fields:
#   handle: "@ChannelHandle"      (or channelId: "UC...")
#   kind: videos | shorts         (defaults to "videos")
#   count: 5                      (max 15 from YouTube's public feed)
#   maxDuration: 10m | false      (optional override of settings.yaml youtube.maxDuration)
#
# Curated list fields:
#   maxDuration: 10m | false      (optional override for all videos in this list)
#   videos: list of video IDs, full YouTube URLs, or { id, title?, start?, end?, maxDuration? }

chrome-devs-videos:
  handle: "@ChromeDevs"
  kind: videos
  count: 5

chrome-devs-shorts:
  handle: "@ChromeDevs"
  kind: shorts
  count: 5

curated-videos:
