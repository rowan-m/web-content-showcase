# Global defaults for the showcase player and build pipeline.
# Durations accept strings ("40s", "2m", "1h") or integer seconds.

duration: 40s
defaultGroup: web

youtube:
  mute: true
  captions: true
  captionLang: en
  controls: false
  # Maximum playback time per video before advancing ("5m", "300s", or false/none for full length).
  # Can be overridden per source or per video in config/youtube.yaml, or via ?maxVideo=... in the URL.
  maxDuration: 5m
